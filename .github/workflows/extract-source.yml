name: Extract Android Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q imaner-alo-voice-studio.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit | xargs -r dirname | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Extract Android project source from ZIP" || echo "No changes to commit"

          git push
